name: mombiz
description: "MomBiz business management app."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: any

  cupertino_icons: ^1.0.8

  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

  http: ^1.6.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  google_fonts: ^8.2.1

  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

  google_sign_in: ^7.2.0

  lucide_icons_flutter: ^3.1.20

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
flutter_launcher_icons:
  android: true
  ios: false

  image_path: "assets/icon/mombiz_icon.png"

  adaptive_icon_background: "#66E98B"
  adaptive_icon_foreground: "assets/icon/mombiz_foreground.png"

  min_sdk_android: 21
